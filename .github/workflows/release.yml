name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Build plugin
        run: |
          npm ci
          npm run build
          cp dist/main.js dist/styles.css .

      - name: Check for optional styles
        id: styles
        run: |
          [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          esc="${ver//./\\.}"
          awk -v v="$esc" '
            $0 ~ "^## \\[" v "\\]" { found=1 }
            found && /^## / && $0 !~ "^## \\[" v "\\]" { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG section for tag $tag in CHANGELOG.md (expected header: ## [$ver])"
            exit 1
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-notes.md \
            main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
